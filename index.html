<!doctype html>
<html lang="az">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171312">
  <meta name="description" content="Onlayn poker — hər zaman yanında. Müasir interfeys və mobil cihazlarda rahat oyun təcrübəsi.">
  <title>Pokerin. Həmişə yanında.</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #171312;
      --bg-soft: #241D1A;
      --text: #F7F0E8;
      --muted: #C4B7AC;
      --blue: #8F302D;
      --blue-light: #D87569;
      --silver: #E8D8C8;
      --line: rgba(216,117,105,.24);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    }
    .page { min-height: 100svh; overflow: hidden; position: relative; isolation: isolate; }
    .page:before {
      content: ""; position: absolute; z-index: -1; inset: 0;
      background:
        radial-gradient(ellipse at 76% 48%, rgba(143,48,45,.25), transparent 38%),
        linear-gradient(132deg, transparent 0 50%, rgba(232,216,200,.055) 50.2%, transparent 50.6%),
        linear-gradient(145deg, #171312 0%, #2A201D 54%, #151110 100%);
    }
    .wrap { width: min(1160px, calc(100% - 48px)); margin-inline: auto; }
    .topbar {
      display: flex; align-items: center; justify-content: space-between; min-height: 78px;
      border-bottom: 1px solid rgba(255,255,255,.09);
    }
    .brand {
      display: inline-flex; align-items: center; gap: 11px; color: var(--text);
      text-decoration: none; font-size: 11px; font-weight: 750; letter-spacing: .2em;
    }
    .brand-mark { width: 7px; height: 7px; background: var(--blue-light); border-radius: 50%; box-shadow: 0 0 18px rgba(216,117,105,.35); }
    .top-note { color: #8F9FB4; font-size: 10px; letter-spacing: .18em; text-transform: uppercase; }
    .hero {
      min-height: calc(100svh - 79px); display: grid; grid-template-columns: 1fr .95fr;
      gap: 54px; align-items: center; padding-block: 72px 88px; position: relative;
    }
    .hero-copy { position: relative; z-index: 2; }
    .eyebrow {
      display: flex; align-items: center; gap: 12px; margin-bottom: 27px;
      color: var(--blue-light); font-size: 10px; font-weight: 750; letter-spacing: .23em;
    }
    .eyebrow:before { content: ""; width: 27px; height: 1px; background: var(--blue-light); }
    h1 {
      margin: 0; max-width: 650px; font-size: clamp(42px, 5.5vw, 72px);
      line-height: .99; letter-spacing: -.065em; font-weight: 650;
    }
    h1 span { color: var(--blue-light); }
    .intro {
      max-width: 470px; margin: 25px 0 0; color: #D0C3B8;
      font-size: clamp(16px, 1.6vw, 18px); line-height: 1.75;
    }
    .cta-row { margin-top: 34px; }
    .cta {
      display: inline-flex; align-items: center; justify-content: center; gap: 20px;
      min-height: 58px; padding: 0 24px; border-radius: 3px; border: 1px solid #B65349;
      background: linear-gradient(135deg, #A8433B, #762723); color: white;
      text-decoration: none; text-transform: uppercase; font-size: 11px; font-weight: 800;
      letter-spacing: .13em; box-shadow: 0 8px 28px rgba(93,25,22,.28);
      transition: transform .18s ease, filter .18s ease;
    }
    .cta:hover { transform: translateY(-2px); filter: brightness(1.12); }
    .cta:focus-visible { outline: 2px solid var(--blue-light); outline-offset: 4px; }
    .cta-arrow { font-size: 18px; font-weight: 400; }
    .visual { position: relative; min-height: 470px; display:grid; place-items:center; perspective:1000px; }
    .card-stage { position:absolute; width:min(100%,490px); height:390px; transform:rotate(-8deg); border:1px solid rgba(232,216,200,.17); background:linear-gradient(140deg,rgba(255,255,255,.055),transparent 45%),linear-gradient(155deg,#342522,#171110 78%); box-shadow:28px 35px 100px rgba(0,0,0,.35); }
    .card-stage:before { content:""; position:absolute; inset:12% 10%; border:1px solid rgba(216,117,105,.2); }
    .hero-card { position:relative; z-index:2; width:min(47%,230px); aspect-ratio:.68; border-radius:7px; padding:15px; background:linear-gradient(145deg,#FFF9F0,#E7D9C9); color:#241A18; box-shadow:25px 35px 55px rgba(0,0,0,.5),inset 0 0 0 1px rgba(60,35,30,.12); transform:rotate(9deg) rotateY(-8deg); }
    .hero-card:before { content:""; position:absolute; inset:8px; border:1px solid rgba(143,48,45,.3); border-radius:3px; }
    .card-corner { position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; font-family:Georgia,serif; font-size:27px; line-height:.9; }
    .card-corner small { font-size:18px; margin-top:4px; }
    .card-suit { position:absolute; inset:0; display:grid; place-items:center; font-family:Georgia,serif; font-size:104px; color:#8F302D; }
    .card-bottom { position:absolute; bottom:15px; right:15px; transform:rotate(180deg); }
    .chip-stack { position:absolute; z-index:3; right:7%; bottom:12%; display:flex; flex-direction:column-reverse; align-items:center; transform:rotate(-13deg); }
    .sculpt-chip { width:68px; height:17px; margin-top:-4px; border-radius:50%; border:3px dashed #E6D7C8; background:linear-gradient(90deg,#632724,#A7443B,#4B1D1B); box-shadow:0 5px 7px #0007; }
    .sculpt-chip:nth-child(2) { background:linear-gradient(90deg,#302724,#66544A,#29201D); border-color:#B9A99A; }
    .sculpt-chip:nth-child(3) { background:linear-gradient(90deg,#632724,#A7443B,#4B1D1B); }
    .visual-caption { position:absolute; z-index:3; left:2%; bottom:7%; color:#B9A69A; font-size:9px; letter-spacing:.25em; text-transform:uppercase; }
    @media (max-width: 800px) {
      .wrap { width: calc(100% - 36px); }
      .topbar { min-height:68px; }
      .top-note { display:none; }
      .hero { min-height:0; grid-template-columns:1fr; gap:26px; padding-block:55px 56px; }
      h1 { font-size:clamp(42px, 11vw, 64px); }
      .visual { min-height:370px; margin-top:2px; }
      .card-stage { width:min(94%,420px); height:310px; }
      .hero-card { width:min(43%,200px); }
      .chip-stack { right:5%; }
      .cta { width:100%; }
    }
    @media (max-width: 420px) {
      .wrap { width:calc(100% - 32px); }
      .hero { padding-top:45px; }
      .visual { min-height:310px; }
      .card-stage { height:265px; }
      .hero-card { width:min(44%,175px); padding:11px; }
      .card-suit { font-size:82px; }
      .sculpt-chip { width:53px; height:14px; }
      .intro { font-size:15px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition:none !important; scroll-behavior:auto !important; } }
  </style>
</head>
<body>
  <div class="page">
    <header class="wrap topbar">
      <a class="brand" href="#" aria-label="Ana səhifə"><span class="brand-mark" aria-hidden="true"></span><span>POKER / ONLINE</span></a>
      <div class="top-note">Dəqiqlik. Rahatlıq. Poker.</div>
    </header>
    <main class="wrap hero">
      <section class="hero-copy" aria-labelledby="hero-title">
        <div class="eyebrow">MOBİL POKER TƏCRÜBƏSİ</div>
        <h1 id="hero-title">TELEFONDA<br><span>POKER</span><br>OYNA</h1>
        <p class="intro">Müasir onlayn poker — istənilən vaxt, sənə uyğun ritmdə.</p>
        <div class="cta-row">
          <a class="cta" href="https://t.me/+m-IwYm3Z2Tk2Nzc6" target="_blank" rel="noopener noreferrer" data-cta="hero">OYUNA DAXİL OL <span class="cta-arrow" aria-hidden="true">↗</span></a>
        </div>
        <p class="footnote">Smartfon · Planşet · Kompüter</p>
      </section>
      <div class="visual" aria-hidden="true">
        <div class="card-stage"></div>
        <div class="hero-card">
          <div class="card-corner">A<small>♠</small></div>
          <div class="card-suit">♠</div>
          <div class="card-corner card-bottom">A<small>♠</small></div>
        </div>
        <div class="chip-stack"><span class="sculpt-chip"></span><span class="sculpt-chip"></span><span class="sculpt-chip"></span></div>
        <div class="visual-caption">THE SIGNATURE CARD · BAKU</div>
      </div>
    </main>
  </div>
